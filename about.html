<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Faizan</title>
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #ffffff;
            --color-text: #000000;
            --color-accent: #00693e;
            --color-muted: #666666;
        }

        ::selection {
            background-color: var(--color-accent);
            color: var(--color-bg);
        }

        ::-moz-selection {
            background-color: var(--color-accent);
            color: var(--color-bg);
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        #mobile-block {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--color-bg);
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 14px;
            z-index: 9999;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            color: var(--color-accent);
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 40px;
        }

        a {
            color: var(--color-accent);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        a:hover {
            text-decoration: underline;
        }

        a:hover::before {
            content: '> ';
        }

        .back-link {
            display: inline-block;
            margin-bottom: 40px;
        }

        .profile-photo {
            width: 100%;
            filter: grayscale(100%);
            border: 1px solid var(--color-text);
            margin-bottom: 25px;
        }

        .about-text {
            line-height: 1.8;
        }

        @media (max-width: 680px) {
            #mobile-block {
                display: flex;
            }
        }
    </style>
</head>

<body>
    <div id="mobile-block">This site is meant to be read on a desktop.</div>

    <div class="container">
        <a href="index.html" class="back-link">← Back</a>
        <h1>About Me</h1>
        <img src="assets/mun-photo.jpg" alt="Faizan at MUN" class="profile-photo">
        <p class="about-text">
            Engineering student at MSRIT, Mathikere. Schooled here too. At this point I'm basically embedded in this
            place.
        </p>
        <br>
        <p class="about-text">
            That's a photo from a school MUN — high school, different time.
        </p>
    </div>


</body>

</html>
