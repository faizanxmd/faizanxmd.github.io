<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Faizan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        ::-moz-selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 40px;
        }

        a {
            color: #00693E;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        a:hover {
            text-decoration: underline;
        }

        a:hover::before {
            content: '> ';
        }

        .back-link {
            display: inline-block;
            margin-bottom: 40px;
        }

        .profile-photo {
            width: 100%;
            filter: grayscale(100%);
            border: 1px solid #000000;
            margin-bottom: 25px;
        }

        .about-text {
            line-height: 1.8;
        }

        /* ========================================
           DARK MODE EASTER EGG - Press ~ (tilde)
           ======================================== */
        body.dark-mode {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        body.dark-mode ::selection {
            background-color: #238636;
            color: #ffffff;
        }

        body.dark-mode ::-moz-selection {
            background-color: #238636;
            color: #ffffff;
        }

        body.dark-mode h1 {
            color: #c9d1d9;
        }

        body.dark-mode a {
            color: #58a6ff;
        }

        body.dark-mode .profile-photo {
            border-color: #30363d;
        }

        /* Dark mode indicator toast */
        .dark-mode-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #238636;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .dark-mode-indicator.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ========================================
           MATRIX MODE EASTER EGG - Konami Code
           ======================================== */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: block;
        }

        #matrix-canvas.active {
            opacity: 0.15;
        }

        body.dark-mode #matrix-canvas.active {
            opacity: 0.25;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back</a>
        <h1>About Me</h1>
        <img src="assets/mun-photo.jpg" alt="Faizan at MUN" class="profile-photo">
        <p class="about-text">This is Faizan.engineering student at msrit.
            ahh and this is an old photo from school MUN.</p>
    </div>

    <!-- Dark Mode Easter Egg Indicator -->
    <div id="darkModeIndicator" class="dark-mode-indicator">🌙 dark mode on</div>

    <!-- Matrix Mode Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <script>
        // ========================================
        // DARK MODE EASTER EGG - Press ~ (tilde) to toggle
        // ========================================
        document.addEventListener('keydown', function(e) {
            if (e.key === '`' || e.key === '~') {
                e.preventDefault();
                const isDark = document.body.classList.toggle('dark-mode');
                
                // Show brief indicator
                const indicator = document.getElementById('darkModeIndicator');
                indicator.textContent = isDark ? 'dark mode on' : 'dark mode off';
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 1500);
            }
        });

        // ========================================
        // MATRIX MODE EASTER EGG - Type "jogi"
        // ========================================
        (function() {
            const triggerWord = 'jogi';
            let jogiIndex = 0;
            let matrixActive = false;
            let matrixInterval = null;

            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Matrix message: "jogi is real"
            const message = 'jogi is real';
            const fontSize = 14;
            let columns, drops, messageIndices;

            function initMatrix() {
                columns = Math.floor(canvas.width / fontSize);
                drops = [];
                messageIndices = [];
                for (let i = 0; i < columns; i++) {
                    drops[i] = Math.random() * -100; // Start above screen randomly
                    messageIndices[i] = Math.floor(Math.random() * message.length);
                }
            }

            function drawMatrix() {
                // Only show in dark mode
                const isDark = document.body.classList.contains('dark-mode');
                if (!isDark) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                
                ctx.fillStyle = 'rgba(13, 17, 23, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#FFD700'; // Golden yellow
                ctx.font = fontSize + 'px "Courier Prime", monospace';

                for (let i = 0; i < drops.length; i++) {
                    // Cycle through the message characters
                    const char = message[messageIndices[i] % message.length];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);

                    // Move to next character in message for this column
                    if (Math.random() > 0.95) {
                        messageIndices[i]++;
                    }

                    // Reset drop to top randomly after it goes below screen
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                        messageIndices[i] = Math.floor(Math.random() * message.length);
                    }
                    drops[i]++;
                }
            }

            function toggleMatrix() {
                matrixActive = !matrixActive;
                const indicator = document.getElementById('darkModeIndicator');

                if (matrixActive) {
                    canvas.classList.add('active');
                    initMatrix();
                    matrixInterval = setInterval(drawMatrix, 50);
                    indicator.textContent = 'jogi is real';
                } else {
                    canvas.classList.remove('active');
                    clearInterval(matrixInterval);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    indicator.textContent = 'matrix mode off';
                }

                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 1500);
            }

            document.addEventListener('keydown', function(e) {
                // Check if the pressed key matches the next letter in "jogi" (case insensitive)
                const expectedChar = triggerWord[jogiIndex];
                if (e.key.toLowerCase() === expectedChar) {
                    jogiIndex++;
                    // If complete word entered
                    if (jogiIndex === triggerWord.length) {
                        toggleMatrix();
                        jogiIndex = 0; // Reset
                    }
                } else {
                    // Reset if wrong key pressed (but allow same starting letter to count)
                    jogiIndex = (e.key.toLowerCase() === triggerWord[0]) ? 1 : 0;
                }

                // ESC to exit matrix mode
                if (e.key === 'Escape' && matrixActive) {
                    toggleMatrix();
                }
            });
        })();
    </script>
</body>

</html>
