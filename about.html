<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Faizan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        ::-moz-selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 40px;
        }

        a {
            color: #00693E;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        a:hover {
            text-decoration: underline;
        }

        a:hover::before {
            content: '> ';
        }

        .back-link {
            display: inline-block;
            margin-bottom: 40px;
        }

        .profile-photo {
            width: 100%;
            filter: grayscale(100%);
            border: 1px solid #000000;
            margin-bottom: 25px;
        }

        .about-text {
            line-height: 1.8;
        }

        /* ========================================
           DARK MODE EASTER EGG - Press ~ (tilde)
           ======================================== */
        body.dark-mode {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        body.dark-mode ::selection {
            background-color: #238636;
            color: #ffffff;
        }

        body.dark-mode ::-moz-selection {
            background-color: #238636;
            color: #ffffff;
        }

        body.dark-mode h1 {
            color: #c9d1d9;
        }

        body.dark-mode a {
            color: #58a6ff;
        }

        body.dark-mode .profile-photo {
            border-color: #30363d;
        }

        /* Dark mode indicator toast */
        .dark-mode-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #238636;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .dark-mode-indicator.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back</a>
        <h1>About Me</h1>
        <img src="assets/mun-photo.jpg" alt="Faizan at MUN" class="profile-photo">
        <p class="about-text">This is Faizan.engineering student at msrit.
            ahh and this is an old photo from school MUN.</p>
    </div>

    <!-- Dark Mode Easter Egg Indicator -->
    <div id="darkModeIndicator" class="dark-mode-indicator">🌙 dark mode on</div>

    <script>
        // ========================================
        // DARK MODE EASTER EGG - Press ~ (tilde) to toggle
        // ========================================
        document.addEventListener('keydown', function(e) {
            if (e.key === '`' || e.key === '~') {
                e.preventDefault();
                const isDark = document.body.classList.toggle('dark-mode');
                
                // Show brief indicator
                const indicator = document.getElementById('darkModeIndicator');
                indicator.textContent = isDark ? '🌙 dark mode on' : '☀️ dark mode off';
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 1500);
            }
        });
    </script>
</body>

</html>
