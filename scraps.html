<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraps - Faizan</title>

    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <script src="assets/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="scraps-page">
    <div class="container">
        <header class="scraps-header">
            <a class="back-link" href="index.html">← back</a>
            <h1 class="page-title scraps-title">Scraps</h1>
            <p class="scraps-datenote">dates are the month a thing landed here, not when I
                found it. <span aria-hidden="true">--</span><span class="sr-only">a double
                    dash</span> means the day wasn't recorded.</p>
        </header>

        <main>
            <!-- Filled in by assets/scraps.js. Starts hidden so a visitor
                 without JS never sees controls that do nothing. -->
            <div class="log-filter" id="scraps-filter" role="group" aria-label="filter the log by kind" hidden>
            </div>
            <p class="log-status" id="scraps-status" role="status"></p>

            <!-- The log rows get built here by assets/scraps.js from the data
                 in assets/scraps-data.js. This starts empty on purpose. -->
            <div class="scraps-log" id="scraps-log"></div>

            <noscript>
                <p class="log-empty">This log is built by a script. Enable JavaScript to read it.</p>
            </noscript>
        </main>

        <footer>
            <div class="footer-content">
                <a class="footer-email" id="footer-email" href="mailto:faizanxmd@gmail.com">faizanxmd@gmail.com</a>
                <!-- The > is the way into the local scraps editor. -->
                <span class="built-in" id="built-in-text"><a class="footer-door" href="editor.html"
                        aria-label="edit scraps">&gt;</a> <span
                        class="footer-location footer-location--nodoor">Built in Mathikere</span></span>
            </div>
        </footer>
    </div>

    <!-- Load the scraps data first, then the code that renders it. -->
    <script src="assets/scraps-data.js"></script>
    <script src="assets/scraps.js"></script>
</body>

</html>
