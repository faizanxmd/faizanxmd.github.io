<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Finds - Faizan</title>
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/easter-eggs.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        ::-moz-selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #666;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .back-link:hover {
            color: #00693E;
            text-decoration: underline;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 8px;
            color: #000000;
        }

        .tagline {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .board {
            display: grid;
            gap: 14px;
        }

        .entry {
            border: 1px solid #e7e7e7;
            padding: 14px 16px;
        }

        .entry-text {
            color: #111;
            line-height: 1.6;
            word-break: break-word;
        }

        .entry-link {
            color: #00693E;
            text-decoration: none;
        }

        .entry-link:hover {
            text-decoration: underline;
        }

        .entry-note {
            margin-top: 6px;
            color: #666;
            font-size: 0.88rem;
        }

        .empty {
            color: #999;
            font-style: italic;
            border: 1px dashed #ddd;
            padding: 14px 16px;
        }

        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9rem;
            color: #666;
        }

        footer a {
            color: #00693E;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back</a>

        <h1 id="board-title">Cool Finds</h1>
        <p class="tagline" id="board-subtitle">pasteboard</p>

        <div class="board" id="board-entries"></div>

        <footer>
            <a href="mailto:me@faizanxmd.online">me@faizanxmd.online</a>
        </footer>
    </div>

    <script src="assets/cool-finds-board.js"></script>
    <script>
        const board = window.COOL_FINDS_BOARD || { title: 'Cool Finds', subtitle: 'pasteboard', entries: [] };

        const titleEl = document.getElementById('board-title');
        const subtitleEl = document.getElementById('board-subtitle');
        const entriesEl = document.getElementById('board-entries');

        titleEl.textContent = board.title || 'Cool Finds';
        subtitleEl.textContent = board.subtitle || 'pasteboard';

        const entries = Array.isArray(board.entries) ? board.entries : [];

        if (entries.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'No entries yet. Add items in assets/cool-finds-board.js';
            entriesEl.appendChild(empty);
        }

        entries.forEach((item) => {
            const card = document.createElement('article');
            card.className = 'entry';

            const text = document.createElement('div');
            text.className = 'entry-text';

            if (item.href) {
                const link = document.createElement('a');
                link.className = 'entry-link';
                link.href = item.href;
                link.textContent = item.text || item.href;
                text.appendChild(link);
            } else {
                text.textContent = item.text || '';
            }

            card.appendChild(text);

            if (item.note) {
                const note = document.createElement('div');
                note.className = 'entry-note';
                note.textContent = item.note;
                card.appendChild(note);
            }

            entriesEl.appendChild(card);
        });
    </script>
    <script src="assets/easter-eggs.js" defer></script>
</body>

</html>
