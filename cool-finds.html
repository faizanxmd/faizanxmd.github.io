<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Finds - Faizan</title>
    <link rel="icon" type="image/png" href="assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        ::-moz-selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        /* Header */
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #666;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #00693E;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 10px;
            color: #000000;
        }

        .tagline {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 50px;
        }

        /* Sections */
        section {
            margin-bottom: 50px;
        }

        h2 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
            color: #004d2e;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        li:last-child {
            border-bottom: none;
        }

        .item-title {
            display: block;
            margin-bottom: 5px;
        }

        .item-title a {
            color: #00693E;
            text-decoration: none;
            font-size: 1.05rem;
        }

        .item-title a:hover {
            text-decoration: underline;
        }

        .item-title a:hover::before {
            content: '> ';
        }

        .item-note {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Empty state */
        .empty {
            color: #999;
            font-style: italic;
        }

        /* Footer */
        footer {
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 0.9rem;
        }

        .footer-item {
            color: #666;
        }

        .footer-item a {
            color: #00693E;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        /* ========================================
           DARK MODE EASTER EGG - Press ~ (tilde)
           ======================================== */
        body.dark-mode {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        body.dark-mode h1 {
            color: #c9d1d9;
        }

        body.dark-mode .tagline {
            color: #8b949e;
        }

        body.dark-mode .back-link {
            color: #8b949e;
        }

        body.dark-mode .back-link:hover {
            color: #58a6ff;
        }

        body.dark-mode h2 {
            color: #7ee787;
        }

        body.dark-mode li {
            color: #58a6ff;
            border-bottom-color: #30363d;
        }

        body.dark-mode .item-title a {
            color: #58a6ff;
        }

        body.dark-mode .item-note {
            color: #8b949e;
        }

        body.dark-mode .empty {
            color: #6e7681;
        }

        body.dark-mode footer {
            border-top-color: #30363d;
        }

        body.dark-mode .footer-item {
            color: #8b949e;
        }

        /* Dark mode indicator toast */
        .dark-mode-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #238636;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .dark-mode-indicator.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ========================================
           MATRIX MODE EASTER EGG - Konami Code
           ======================================== */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: block;
        }

        #matrix-canvas.active {
            opacity: 0.15;
        }

        body.dark-mode #matrix-canvas.active {
            opacity: 0.25;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back</a>
        
        <h1>Cool Finds</h1>
        <p class="tagline">a bookmark for your thoughts</p>

        <section>
            <h2>Links</h2>
            <ul>
                <li>
                    <span class="item-title"><a href="#">Placeholder Link</a></span>
                    <span class="item-note">A placeholder for future discoveries.</span>
                </li>
            </ul>
        </section>

        <section>
            <h2>Quotes</h2>
            <ul>
                <li class="empty">Nothing here yet.</li>
            </ul>
        </section>

        <section>
            <h2>Tools</h2>
            <ul>
                <li class="empty">Nothing here yet.</li>
            </ul>
        </section>

        <footer>
            <div class="footer-content">
                <span class="footer-item"><a href="https://github.com/faizanxmd">GitHub</a></span>
                <span class="footer-item"><a href="mailto:me@faizanxmd.online">me@faizanxmd.online</a></span>
            </div>
        </footer>
    </div>

    <!-- Dark Mode Easter Egg Indicator -->
    <div id="darkModeIndicator" class="dark-mode-indicator">🌙 dark mode on</div>

    <!-- Matrix Mode Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <script>
        // ========================================
        // DARK MODE EASTER EGG - Press ~ (tilde) to toggle
        // ========================================
        document.addEventListener('keydown', function(e) {
            if (e.key === '`' || e.key === '~') {
                e.preventDefault();
                const isDark = document.body.classList.toggle('dark-mode');
                
                // Show brief indicator
                const indicator = document.getElementById('darkModeIndicator');
                indicator.textContent = isDark ? '🌙 dark mode on' : '☀️ dark mode off';
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 1500);
            }
        });

        // ========================================
        // MATRIX MODE EASTER EGG - Type "jogi"
        // ========================================
        (function() {
            const triggerWord = 'jogi';
            let jogiIndex = 0;
            let matrixActive = false;
            let matrixInterval = null;

            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Matrix message: "jogi is real"
            const message = 'jogi is real';
            const fontSize = 14;
            let columns, drops, messageIndices;

            function initMatrix() {
                columns = Math.floor(canvas.width / fontSize);
                drops = [];
                messageIndices = [];
                for (let i = 0; i < columns; i++) {
                    drops[i] = Math.random() * -100; // Start above screen randomly
                    messageIndices[i] = Math.floor(Math.random() * message.length);
                }
            }

            function drawMatrix() {
                // Fade effect - use the body background color with low opacity
                const isDark = document.body.classList.contains('dark-mode');
                ctx.fillStyle = isDark ? 'rgba(13, 17, 23, 0.05)' : 'rgba(255, 255, 255, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#FFD700'; // Golden yellow
                ctx.font = fontSize + 'px "Courier Prime", monospace';

                for (let i = 0; i < drops.length; i++) {
                    // Cycle through the message characters
                    const char = message[messageIndices[i] % message.length];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);

                    // Move to next character in message for this column
                    if (Math.random() > 0.95) {
                        messageIndices[i]++;
                    }

                    // Reset drop to top randomly after it goes below screen
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                        messageIndices[i] = Math.floor(Math.random() * message.length);
                    }
                    drops[i]++;
                }
            }

            function toggleMatrix() {
                matrixActive = !matrixActive;
                const indicator = document.getElementById('darkModeIndicator');

                if (matrixActive) {
                    canvas.classList.add('active');
                    initMatrix();
                    matrixInterval = setInterval(drawMatrix, 50);
                    indicator.textContent = '💊 jogi is real';
                } else {
                    canvas.classList.remove('active');
                    clearInterval(matrixInterval);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    indicator.textContent = '💊 matrix mode off';
                }

                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 1500);
            }

            document.addEventListener('keydown', function(e) {
                // Check if the pressed key matches the next letter in "jogi" (case insensitive)
                const expectedChar = triggerWord[jogiIndex];
                if (e.key.toLowerCase() === expectedChar) {
                    jogiIndex++;
                    // If complete word entered
                    if (jogiIndex === triggerWord.length) {
                        toggleMatrix();
                        jogiIndex = 0; // Reset
                    }
                } else {
                    // Reset if wrong key pressed (but allow same starting letter to count)
                    jogiIndex = (e.key.toLowerCase() === triggerWord[0]) ? 1 : 0;
                }

                // ESC to exit matrix mode
                if (e.key === 'Escape' && matrixActive) {
                    toggleMatrix();
                }
            });
        })();
    </script>
</body>

</html>
