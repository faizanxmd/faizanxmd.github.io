<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Finds - Faizan</title>
    <meta name="description" content="A pasteboard of links, quotes, and rabbit holes.">
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <script src="assets/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div class="container">
        <div class="back-link">
            <a href="index.html">← Back</a>
        </div>

        <header>
            <h1 class="page-title" id="board-title">Cool Finds</h1>
            <p class="page-subline" id="board-subtitle">pasteboard</p>
        </header>

        <div class="board" id="board-entries"></div>

        <footer>
            <div class="footer-content">
                <span class="footer-item"><a href="mailto:faizanxmd@gmail.com">faizanxmd@gmail.com</a></span>
                <span class="built-in"><span class="footer-location">Built in Mathikere</span></span>
            </div>
        </footer>
    </div>

    <script src="assets/cool-finds-board.js"></script>
    <script>
        const board = window.COOL_FINDS_BOARD || { title: 'Cool Finds', subtitle: 'pasteboard', entries: [] };

        const titleEl = document.getElementById('board-title');
        const subtitleEl = document.getElementById('board-subtitle');
        const entriesEl = document.getElementById('board-entries');

        titleEl.textContent = board.title || 'Cool Finds';
        subtitleEl.textContent = board.subtitle || 'pasteboard';

        const entries = Array.isArray(board.entries) ? board.entries : [];

        if (entries.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'No entries yet. Add items in assets/cool-finds-board.js';
            entriesEl.appendChild(empty);
        }

        entries.forEach((item) => {
            const card = document.createElement('article');
            card.className = 'entry';

            const text = document.createElement('div');
            text.className = 'entry-text';

            if (item.href) {
                const link = document.createElement('a');
                link.className = 'entry-link';
                link.href = item.href;
                link.textContent = item.text || item.href;
                text.appendChild(link);
            } else {
                text.textContent = item.text || '';
            }

            card.appendChild(text);

            if (item.note) {
                const note = document.createElement('div');
                note.className = 'entry-note';
                note.textContent = item.note;
                card.appendChild(note);
            }

            entriesEl.appendChild(card);
        });
    </script>
</body>

</html>
