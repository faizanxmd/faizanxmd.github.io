<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        (function () {
            function applyScheme() {
                var stored = localStorage.getItem('color-scheme');
                var osDark = window.matchMedia(
                    '(prefers-color-scheme: dark)'
                ).matches;
                var useDark =
                    stored === 'dark' ? true
                        : stored === 'light' ? false
                            : osDark;

                document.documentElement.classList.toggle('dark-mode', useDark);
            }

            applyScheme();

            // bfcache fix — re-apply when restored from back/forward cache
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) applyScheme();
            });
        })();
    </script>
    <style>
        html.dark-mode {
            --color-bg: #0d1117;
            --color-text: #c9d1d9;
            --color-accent: #5aba7a;
            --color-muted: #8b949e;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Finds - Faizan</title>
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #ffffff;
            --color-text: #000000;
            --color-accent: #00693e;
            --color-muted: #666666;
        }

        ::selection {
            background-color: #00693e;
            color: #fff;
        }

        ::-moz-selection {
            background-color: #00693e;
            color: #fff;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        #mobile-block {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--color-bg);
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 14px;
            z-index: 9999;
            box-sizing: border-box;
            align-items: center;
            justify-content: center;
            color: var(--color-accent);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--color-muted);
            font-size: 0.9rem;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--color-accent);
            text-decoration: underline;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        .tagline {
            color: var(--color-muted);
            font-size: 0.95rem;
            margin-bottom: 40px;
        }

        .board {
            display: grid;
            gap: 14px;
        }

        .entry {
            border: 1px solid #e7e7e7;
            padding: 14px 16px;
        }

        .entry-text {
            color: #111;
            line-height: 1.6;
            word-break: break-word;
        }

        .entry-link {
            color: var(--color-accent);
            text-decoration: none;
        }

        .entry-link:hover {
            text-decoration: underline;
        }

        .entry-note {
            margin-top: 6px;
            color: var(--color-muted);
            font-size: 0.88rem;
        }

        .empty {
            color: #999;
            font-style: italic;
            border: 1px dashed #ddd;
            padding: 14px 16px;
        }

        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9rem;
            color: var(--color-muted);
        }

        footer a {
            color: var(--color-accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 680px) {
            #mobile-block {
                display: flex;
            }

            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div id="mobile-block">This site is meant to be read on a desktop.</div>

    <div class="container">
        <a href="index.html" class="back-link">← Back</a>

        <h1 id="board-title">Cool Finds</h1>
        <p class="tagline" id="board-subtitle">pasteboard</p>

        <div class="board" id="board-entries"></div>

        <footer>
            <a href="mailto:me@faizanxmd.online">me@faizanxmd.online</a>
        </footer>
    </div>

    <script src="assets/cool-finds-board.js"></script>
    <script>
        const board = window.COOL_FINDS_BOARD || { title: 'Cool Finds', subtitle: 'pasteboard', entries: [] };

        const titleEl = document.getElementById('board-title');
        const subtitleEl = document.getElementById('board-subtitle');
        const entriesEl = document.getElementById('board-entries');

        titleEl.textContent = board.title || 'Cool Finds';
        subtitleEl.textContent = board.subtitle || 'pasteboard';

        const entries = Array.isArray(board.entries) ? board.entries : [];

        if (entries.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'No entries yet. Add items in assets/cool-finds-board.js';
            entriesEl.appendChild(empty);
        }

        entries.forEach((item) => {
            const card = document.createElement('article');
            card.className = 'entry';

            const text = document.createElement('div');
            text.className = 'entry-text';

            if (item.href) {
                const link = document.createElement('a');
                link.className = 'entry-link';
                link.href = item.href;
                link.textContent = item.text || item.href;
                text.appendChild(link);
            } else {
                text.textContent = item.text || '';
            }

            card.appendChild(text);

            if (item.note) {
                const note = document.createElement('div');
                note.className = 'entry-note';
                note.textContent = item.note;
                card.appendChild(note);
            }

            entriesEl.appendChild(card);
        });
    </script>
    <script>
        document.addEventListener('keydown', function (e) {
            if (e.key === '`') {
                var current = localStorage.getItem('color-scheme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (!current) {
                    localStorage.setItem('color-scheme', prefersDark ? 'light' : 'dark');
                } else if (current === 'dark') {
                    localStorage.setItem('color-scheme', 'light');
                } else {
                    localStorage.removeItem('color-scheme');
                }
                var override = localStorage.getItem('color-scheme');
                var shouldDark = override === 'dark' || (!override && prefersDark);
                document.documentElement.classList.toggle('dark-mode', shouldDark);
            }
        });
    </script>
</body>

</html>
