<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Finds - Faizan</title>
    <link rel="icon" type="image/png" href="assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        ::-moz-selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        /* Header */
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #666;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #00693E;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 10px;
            color: #000000;
        }

        .tagline {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 50px;
        }

        /* Sections */
        section {
            margin-bottom: 50px;
        }

        h2 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
            color: #004d2e;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        li:last-child {
            border-bottom: none;
        }

        .item-title {
            display: block;
            margin-bottom: 5px;
        }

        .item-title a {
            color: #00693E;
            text-decoration: none;
            font-size: 1.05rem;
        }

        .item-title a:hover {
            text-decoration: underline;
        }

        .item-title a:hover::before {
            content: '> ';
        }

        .item-note {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Empty state */
        .empty {
            color: #999;
            font-style: italic;
        }

        /* Footer */
        footer {
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 0.9rem;
        }

        .footer-item {
            color: #666;
        }

        .footer-item a {
            color: #00693E;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        /* ========================================
           DARK MODE EASTER EGG - Press ~ (tilde)
           ======================================== */
        body.dark-mode {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        body.dark-mode h1 {
            color: #c9d1d9;
        }

        body.dark-mode .tagline {
            color: #8b949e;
        }

        body.dark-mode .back-link {
            color: #8b949e;
        }

        body.dark-mode .back-link:hover {
            color: #58a6ff;
        }

        body.dark-mode h2 {
            color: #7ee787;
        }

        body.dark-mode li {
            color: #58a6ff;
            border-bottom-color: #30363d;
        }

        body.dark-mode .item-title a {
            color: #58a6ff;
        }

        body.dark-mode .item-note {
            color: #8b949e;
        }

        body.dark-mode .empty {
            color: #6e7681;
        }

        body.dark-mode footer {
            border-top-color: #30363d;
        }

        body.dark-mode .footer-item {
            color: #8b949e;
        }

        /* Dark mode indicator toast */
        .dark-mode-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #238636;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .dark-mode-indicator.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back</a>
        
        <h1>Cool Finds</h1>
        <p class="tagline">a bookmark for your thoughts</p>

        <section>
            <h2>Links</h2>
            <ul>
                <li>
                    <span class="item-title"><a href="#">Placeholder Link</a></span>
                    <span class="item-note">A placeholder for future discoveries.</span>
                </li>
            </ul>
        </section>

        <section>
            <h2>Quotes</h2>
            <ul>
                <li class="empty">Nothing here yet.</li>
            </ul>
        </section>

        <section>
            <h2>Tools</h2>
            <ul>
                <li class="empty">Nothing here yet.</li>
            </ul>
        </section>

        <footer>
            <div class="footer-content">
                <span class="footer-item"><a href="https://github.com/faizanxmd">GitHub</a></span>
                <span class="footer-item"><a href="mailto:me@faizanxmd.online">me@faizanxmd.online</a></span>
            </div>
        </footer>
    </div>

    <!-- Dark Mode Easter Egg Indicator -->
    <div id="darkModeIndicator" class="dark-mode-indicator">🌙 dark mode on</div>

    <script>
        // ========================================
        // DARK MODE EASTER EGG - Press ~ (tilde) to toggle
        // ========================================
        document.addEventListener('keydown', function(e) {
            if (e.key === '`' || e.key === '~') {
                e.preventDefault();
                const isDark = document.body.classList.toggle('dark-mode');
                
                // Show brief indicator
                const indicator = document.getElementById('darkModeIndicator');
                indicator.textContent = isDark ? '🌙 dark mode on' : '☀️ dark mode off';
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 1500);
            }
        });
    </script>
</body>

</html>
