<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faizan</title>
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        ::-moz-selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        /* Header */
        header {
            margin-bottom: 50px;
        }

        .site-name {
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 8px;
            color: #000000;
        }

        .site-subline {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }

        .cursor {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        /* Single column sections */
        section {
            margin-bottom: 40px;
        }

        h2 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
            color: #004d2e;
        }

        h2 a {
            color: inherit;
        }

        p {
            color: #00693E;
            line-height: 1.7;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 6px;
            color: #00693E;
        }

        a {
            color: #00693E;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        a:hover {
            text-decoration: underline;
        }

        a:hover::before {
            content: '> ';
        }

        /* Footer */
        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 0.9rem;
        }

        .footer-item {
            color: #666;
        }

        .footer-item a {
            color: #00693E;
        }

        .built-in {
            width: 100%;
            font-size: 0.8rem;
            color: #999;
            margin-top: 8px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            .site-name {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1 class="site-name" id="site-name"><span class="cursor">█</span></h1>
        </header>

        <!-- WRITING Section -->
        <section>
            <h2>Writing</h2>
            <ul>
                <li><a href="articles/us-election.html">US Election 2024</a></li>
            </ul>
        </section>

        <!-- WORKBENCH Section -->
        <section>
            <h2><a href="#">Workbench</a></h2>
        </section>

        <!-- SCRAPS Section -->
        <section>
            <h2><a href="scraps.html">Scraps</a></h2>
        </section>

        <!-- About Section -->
        <section>
            <h2><a href="about.html">About</a></h2>
        </section>

        <footer>
            <div class="footer-content">
                <span class="footer-item"><a id="footer-email"
                        href="mailto:me@faizanxmd.online">me@faizanxmd.online</a></span>
                <span class="built-in" id="built-in-text">Built in Mathikere</span>
            </div>
        </footer>
    </div>

    <script>
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function typeWriter(element, text) {
            const cursor = '<span class="cursor">█</span>';

            for (let i = 0; i <= text.length; i++) {
                element.innerHTML = text.substring(0, i) + cursor;
                await sleep(100);
            }
        }

        async function animateHeader() {
            const h1 = document.getElementById('site-name');
            const cursor = '<span class="cursor">█</span>';

            await typeWriter(h1, "Faizn");
            await sleep(800);
            h1.innerHTML = "Faiz" + cursor;
            await sleep(100);
            h1.innerHTML = "Faiza" + cursor;
            await sleep(100);
            h1.innerHTML = "Faizan" + cursor;
            await sleep(300);
            h1.innerHTML = "Faizan." + cursor;
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(animateHeader, 300);
        });
    </script>

</body>

</html>
