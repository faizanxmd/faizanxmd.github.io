<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faizan</title>
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/easter-eggs.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        ::-moz-selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        /* Header */
        header {
            margin-bottom: 50px;
        }

        .site-name {
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 8px;
            color: #000000;
        }

        .site-subline {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }

        .cursor {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Row layout */
        .row {
            display: flex;
            gap: 60px;
            margin-bottom: 40px;
        }

        .row .col {
            flex: 1;
            min-width: 0;
        }

        /* Sections */
        section {
            margin-bottom: 0;
        }

        h2 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
            color: #004d2e;
        }

        h2 a {
            color: inherit;
        }

        p {
            color: #00693E;
            line-height: 1.7;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 6px;
            color: #00693E;
        }

        a {
            color: #00693E;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        a:hover {
            text-decoration: underline;
        }

        a:hover::before {
            content: '> ';
        }

        /* Full-width sections */
        .full-width {
            margin-bottom: 50px;
        }

        /* Footer */
        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 0.9rem;
        }

        .footer-item {
            color: #666;
        }

        .footer-item a {
            color: #00693E;
        }

        .built-in {
            width: 100%;
            font-size: 0.8rem;
            color: #999;
            margin-top: 8px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            .site-name {
                font-size: 2rem;
            }

            .row {
                flex-direction: column;
                gap: 35px;
            }
        }

    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 class="site-name" id="site-name"><span class="cursor">█</span></h1>
            <p class="site-subline">Updated <span id="update-date">Feb 2, 2026</span></p>
        </header>

        <div id="home-rows"></div>

        <footer>
            <div class="footer-content">
                <span class="footer-item"><a id="footer-email" href="mailto:me@faizanxmd.online">me@faizanxmd.online</a></span>
                <span class="built-in" id="built-in-text">Built in Mathikere</span>
            </div>
        </footer>
    </div>

    <script src="assets/site-content.js"></script>
    <script>
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
        const defaultContent = {
            home: {
                rows: [],
                footer: {
                    email: 'me@faizanxmd.online',
                    builtIn: 'Built in Mathikere'
                }
            }
        };
        const content = window.SITE_CONTENT || defaultContent;

        async function typeWriter(element, text) {
            const cursor = '<span class="cursor">█</span>';
            
            for (let i = 0; i <= text.length; i++) {
                element.innerHTML = text.substring(0, i) + cursor;
                await sleep(100);
            }
        }

        async function animateHeader() {
            const h1 = document.getElementById('site-name');
            const cursor = '<span class="cursor">█</span>';
            
            await typeWriter(h1, "Faizn");
            await sleep(800);
            h1.innerHTML = "Faiz" + cursor;
            await sleep(100);
            h1.innerHTML = "Faiza" + cursor;
            await sleep(100);
            h1.innerHTML = "Faizan" + cursor;
        }

        async function fetchLatestUpdateDate() {
            try {
                const response = await fetch('/api/last-updated');
                if (!response.ok) return;

                const data = await response.json();
                if (!data || !data.ok || !data.date) return;

                const el = document.getElementById('update-date');
                if (el) el.textContent = data.date;
            } catch (_error) {
                // Keep fallback date when API is unavailable.
            }
        }

        function renderSection(sectionData) {
            const section = document.createElement('section');
            section.className = 'col';
            const h2 = document.createElement('h2');

            if (sectionData.href) {
                const link = document.createElement('a');
                link.href = sectionData.href;
                link.textContent = sectionData.title;
                h2.appendChild(link);
                section.appendChild(h2);
                return section;
            }

            h2.textContent = sectionData.title || '';
            section.appendChild(h2);

            const items = Array.isArray(sectionData.items) ? sectionData.items : [];
            if (items.length > 0) {
                const ul = document.createElement('ul');
                items.forEach((item) => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = item.href || '#';
                    a.textContent = item.label || '';
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                section.appendChild(ul);
            }

            return section;
        }

        function renderHomeRows() {
            const container = document.getElementById('home-rows');
            if (!container) return;

            const rows = content?.home?.rows || [];
            rows.forEach((rowData) => {
                const row = document.createElement('div');
                row.className = 'row';
                row.appendChild(renderSection(rowData.left || {}));
                row.appendChild(renderSection(rowData.right || {}));
                container.appendChild(row);
            });
        }

        function renderFooter() {
            const email = content?.home?.footer?.email;
            const builtIn = content?.home?.footer?.builtIn;

            const emailEl = document.getElementById('footer-email');
            if (emailEl && email) {
                emailEl.textContent = email;
                emailEl.href = `mailto:${email}`;
            }

            const builtInEl = document.getElementById('built-in-text');
            if (builtInEl && builtIn) builtInEl.textContent = builtIn;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderHomeRows();
            renderFooter();
            setTimeout(animateHeader, 300);
            fetchLatestUpdateDate();
        });
    </script>
    <script src="assets/easter-eggs.js" defer></script>
</body>

</html>
