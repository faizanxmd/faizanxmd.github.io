<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faizan</title>
    <link rel="icon" type="image/png" href="assets/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        ::-moz-selection {
            background-color: #00693E;
            color: #FFFFFF;
        }

        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: 'Courier Prime', 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 60px;
        }

        .cursor {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        section {
            margin-bottom: 50px;
        }

        h2 {
            font-size: 1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 15px;
            color: #000000;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            color: #00693E;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        a:hover {
            text-decoration: underline;
        }

        a::before {
            content: '';
            transition: content 0.15s ease;
        }

        a:hover::before {
            content: '> ';
        }

        footer {
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid #000000;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-item {
            font-size: 0.9rem;
        }

        .footer-item span {
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container" id="app"></div>

    <script>
        const siteData = {
            name: "Faizan",
            sections: {
                writing: {
                    title: "Writing",
                    items: [
                        { title: "US Election 2024", link: "articles/us-election.html" },
                    ]
                },
                reading: {
                    title: "Reading",
                    items: [
                        { title: "Beej's Guide to C", link: "https://beej.us/guide/bgc/" },
                        { title: "The Stand", link: "https://en.wikipedia.org/wiki/The_Stand" },
                        { title: "Sapiens", link: "https://en.wikipedia.org/wiki/Sapiens:_A_Brief_History_of_Humankind" }
                    ]
                },
                signal: {
                    title: "Signal",
                    items: [
                        { title: "What's Going On Here? (Graham Duncan)", link: "https://grahamduncan.blog/whats-going-on-here/" },
                        { title: "Lil Mo", link: "https://robinhome.vercel.app/" }
                    ]
                },
                heavyRotation: {
                    title: "Heavy Rotation",
                    items: [
                        { title: "Bitter Sweet Symphony", link: "https://youtu.be/1lyu1KKwC74" },
                        { title: "Rubber Soul (Album)", link: "https://youtube.com/playlist?list=PLL-NbN8uTOigsPnqWhPLWJ4ADAkmNbrQI" },
                        { title: "Far From Any Road", link: "https://www.youtube.com/watch?v=TRJ_s2G76Hg" },
                        { title: "ants in my room", link: "https://www.youtube.com/watch?v=McvdQYzlLM8" }
                    ]
                }
            },
            about: {
                title: "About Me",
                link: "about.html"
            },
            now: {
                title: "Now",
                text: "finals — nothing much"
            },
            coolFinds: {
                title: "Cool Finds",
                items: [
                    { title: "a bookmark for your thoughts", link: "#" }
                ]
            },
            footer: {
                github: "faizanxmd",
                email: "me@faizanxmd.online",
                location: "Mathikere"
            }
        };

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function typeWriter(element, text) {
            const cursor = '<span class="cursor">█</span>';
            
            for (let i = 0; i <= text.length; i++) {
                element.innerHTML = text.substring(0, i) + cursor;
                await sleep(100);
            }
        }

        async function animateHeader() {
            const h1 = document.getElementById('site-title');
            const cursor = '<span class="cursor">█</span>';
            
            // Type "Faizn" (with typo)
            await typeWriter(h1, "Faizn");
            
            // Wait
            await sleep(800);
            
            // Backspace 1 char
            h1.innerHTML = "Faiz" + cursor;
            await sleep(100);
            
            // Type "an" to complete
            h1.innerHTML = "Faiza" + cursor;
            await sleep(100);
            h1.innerHTML = "Faizan" + cursor;
        }

        function renderSection(key, section) {
            return `
                <section>
                    <h2>${section.title}</h2>
                    <ul>
                        ${section.items.map(item => `
                            <li><a href="${item.link}">${item.title}</a></li>
                        `).join('')}
                    </ul>
                </section>
            `;
        }

        function renderAbout(about) {
            return `
                <section>
                    <h2><a href="${about.link}">${about.title}</a></h2>
                </section>
            `;
        }

        function renderNow(now) {
            return `
                <section>
                    <h2>${now.title}</h2>
                    <p style="color: #00693E;">${now.text}</p>
                </section>
            `;
        }

        function renderCoolFinds(coolFinds) {
            return `
                <section>
                    <h2>${coolFinds.title}</h2>
                    <ul>
                        ${coolFinds.items.map(item => `
                            <li><a href="${item.link}">${item.title}</a></li>
                        `).join('')}
                    </ul>
                </section>
            `;
        }

        async function fetchLatestCommit() {
            try {
                const response = await fetch('https://api.github.com/repos/faizanxmd/mysite/commits/main');
                const data = await response.json();
                const date = new Date(data.commit.committer.date);
                const formattedDate = date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                });
                const link = document.getElementById('commit-link');
                if (link) {
                    link.textContent = formattedDate;
                    link.href = data.html_url;
                }
            } catch (error) {
                const link = document.getElementById('commit-link');
                if (link) link.textContent = '—';
            }
        }

        function renderFooter(footer) {
            return `
                <footer>
                    <div class="footer-links">
                        <div class="footer-item">
                            <a href="https://github.com/${footer.github}">GitHub</a>
                        </div>
                        <div class="footer-item">
                            <a href="mailto:${footer.email}">${footer.email}</a>
                        </div>
                        <div class="footer-item">
                            <span>${footer.location}</span>
                        </div>
                        <div class="footer-item">
                            <span>updated </span><a id="commit-link" href="#" target="_blank">—</a>
                        </div>
                    </div>
                </footer>
            `;
        }

        function render() {
            const app = document.getElementById('app');

            let html = `<h1 id="site-title"><span class="cursor">█</span></h1>`;

            for (const [key, section] of Object.entries(siteData.sections)) {
                html += renderSection(key, section);
            }

            html += renderNow(siteData.now);
            html += renderCoolFinds(siteData.coolFinds);
            html += renderAbout(siteData.about);
            html += renderFooter(siteData.footer);

            app.innerHTML = html;

            setTimeout(animateHeader, 300);
            fetchLatestCommit();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>

</html>
