<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faizan</title>
    <meta name="description" content="Faizan's corner of the internet. Writing, scraps, cool finds. Built in Mathikere.">
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <script src="assets/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="home">
    <div class="container">
        <header>
            <h1 class="site-name" id="site-name"><span class="cursor">█</span></h1>
        </header>

        <main class="home-main">
            <div id="term">
                <div id="term-output"></div>
                <div class="term-line">
                    <span class="term-prompt">~ $</span>
                    <input id="term-input" type="text" autocomplete="off" spellcheck="false" aria-label="terminal input">
                </div>
            </div>

            <nav class="home-nav" aria-label="Main">
                <section class="index-section">
                    <h2><a href="writing.html">Writing</a></h2>
                </section>

                <section class="index-section">
                    <h2><a href="scraps.html">Scraps</a></h2>
                </section>

                <section class="index-section">
                    <h2><a href="cool-finds.html">Cool Finds</a></h2>
                </section>

                <section class="index-section">
                    <h2><a href="workbench.html">Workbench</a></h2>
                </section>

                <section class="index-section">
                    <h2><a href="about.html">About</a></h2>
                </section>
            </nav>

            <p class="terminal-hint sr-only">psst — this site has a terminal. find it.</p>
        </main>

        <footer>
            <div class="footer-content">
                <a class="footer-email" id="footer-email" href="mailto:faizanxmd@gmail.com">faizanxmd@gmail.com</a>
                <span class="built-in" id="built-in-text"><span class="footer-location">Built in Mathikere</span></span>
            </div>
        </footer>
    </div>

    <script>
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function typeWriter(element, text) {
            const cursor = '<span class="cursor">█</span>';

            for (let i = 0; i <= text.length; i++) {
                element.innerHTML = text.substring(0, i) + cursor;
                await sleep(100);
            }
        }

        async function animateHeader() {
            const h1 = document.getElementById('site-name');
            const cursor = '<span class="cursor">█</span>';

            await typeWriter(h1, "Faizn");
            await sleep(800);
            h1.innerHTML = "Faiz" + cursor;
            await sleep(100);
            h1.innerHTML = "Faiza" + cursor;
            await sleep(100);
            h1.innerHTML = "Faizan" + cursor;
            await sleep(300);
            h1.innerHTML = "Faizan." + cursor;
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(animateHeader, 300);
        });
    </script>
    <script src="assets/terminal.js" defer></script>
</body>

</html>
