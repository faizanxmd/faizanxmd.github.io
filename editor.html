<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraps Editor</title>
    <meta name="description" content="Local editor for the scraps page.">
    <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
    <script src="assets/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        /* ── Editor-only styling. This page is a local tool, so it has its own
              simple chrome on top of the shared site styles. ── */
        .editor-wrap { max-width: 720px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
        .editor-wrap h1 { margin: var(--space-4) 0 var(--space-7); }
        .editor-wrap h2 { margin: 0 0 var(--space-5); }

        .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--space-4); }
        .field label { font-size: 0.8rem; color: var(--color-muted); text-transform: lowercase; letter-spacing: 0.04em; }
        .field input, .field select {
            font-family: inherit; font-size: 0.95rem; padding: 8px 10px;
            background: var(--color-surface); color: var(--color-text);
            border: 1px solid var(--color-hairline); border-radius: 3px;
        }
        .field input:focus, .field select:focus { outline: none; border-color: var(--color-accent); }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }

        .field .hint { opacity: 0.7; letter-spacing: 0; }
        .btn-tiny { align-self: flex-start; margin-top: 6px; padding: 3px 10px; font-size: 0.75rem; }

        .btn {
            font-family: inherit; font-size: 0.9rem; cursor: pointer;
            padding: 8px 16px; border-radius: 3px;
            border: 1px solid var(--color-accent); background: var(--color-accent); color: #fff;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: transparent; color: var(--color-text); border-color: var(--color-hairline); }
        .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: var(--space-4); }

        .divider { border: none; border-top: 1px solid var(--color-hairline); margin: var(--space-8) 0; }

        .list-row {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px; border: 1px solid var(--color-hairline);
            border-radius: 3px; margin-bottom: 10px; background: var(--color-surface);
        }
        .list-row .grab { color: var(--color-muted); font-size: 0.8rem; min-width: 22px; }
        .list-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .list-row .mini-tag { color: var(--color-muted); font-size: 0.75rem; }
        .icon-btn {
            font-family: inherit; cursor: pointer; background: transparent;
            border: 1px solid var(--color-hairline); border-radius: 3px;
            color: var(--color-text); padding: 3px 8px; font-size: 0.8rem;
        }
        .icon-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }

        .save-note { font-size: 0.8rem; color: var(--color-muted); margin-top: var(--space-3); line-height: 1.6; }
        .preview-frame { margin-top: var(--space-4); padding: var(--space-4); border: 1px dashed var(--color-hairline); border-radius: 4px; }
        .status { font-size: 0.85rem; color: var(--color-accent); min-height: 1.2em; margin-top: 8px; }

        @media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <div class="editor-wrap">
        <a class="back-link" href="scraps.html">← back to scraps</a>
        <h1 class="page-title">Scraps Editor</h1>

        <!-- ── THE FORM: the everyday fields ── -->
        <div class="field">
            <label for="f-title">title</label>
            <input id="f-title" type="text">
        </div>

        <div class="two-col">
            <div class="field">
                <label for="f-kind">kind</label>
                <select id="f-kind"><!-- options injected from KINDS in scraps.js --></select>
            </div>
            <div class="field">
                <!-- Deliberately a text input, not type="date"/"month": the native
                     pickers force a complete date and can't express "month only" or
                     "don't know", which is the whole point of the schema. -->
                <label for="f-date">date <span class="hint">day · month · or blank</span></label>
                <input id="f-date" type="text" placeholder="2026-07-30 · 2026-07 · blank">
                <button class="btn btn-secondary btn-tiny" id="today-btn" type="button">today</button>
            </div>
        </div>

        <div class="field">
            <label for="f-link">link</label>
            <input id="f-link" type="text" placeholder="https://…">
        </div>

        <div class="field">
            <label for="f-note">note <span class="hint">your words — leave blank rather than pad it</span></label>
            <input id="f-note" type="text">
        </div>

        <div class="btn-row">
            <button class="btn" id="submit-btn" type="button">+ Add scrap</button>
            <button class="btn btn-secondary" id="cancel-btn" type="button" style="display:none;">cancel</button>
        </div>

        <hr class="divider">

        <!-- ── THE CURRENT LIST: reorder / edit / delete ── -->
        <h2 class="page-title" style="font-size:1.1rem;">your scraps <span id="count" class="mini-tag"></span></h2>
        <div id="list"></div>

        <div class="btn-row">
            <button class="btn" id="save-btn" type="button">Save to scraps-data.js</button>
        </div>
        <div class="status" id="status"></div>

        <!-- ── LIVE PREVIEW: the real cards, built with the same code as the site ── -->
        <hr class="divider">
        <h2 class="page-title" style="font-size:1.1rem;">live preview</h2>
        <div class="preview-frame">
            <div class="scraps-log" id="editor-preview"></div>
        </div>
    </div>

    <!-- Reuse the site's own data + renderer. scraps.js's initScraps() harmlessly
         no-ops here because there's no #scraps-log (so its keyboard filter is never
         bound either); we call renderLogInto ourselves. -->
    <script src="assets/scraps-data.js"></script>
    <script src="assets/scraps.js"></script>
    <script>
        // "2026-07-30", or "2026-07", or empty. Nothing else is accepted.
        const DATE_RE = /^(\d{4}-\d{2}(-\d{2})?)?$/;

        const FILE_HEADER =
`// ─────────────────────────────────────────────────────────────────────────
// SCRAPS — the log. One record per thing.
//
//   date   OPTIONAL. "2026-07-30" if you know the day. "2026-07" if you only
//          know the month. LEAVE THE KEY OUT if you don't know at all — the
//          page prints "--" and says nothing it can't back up. Never guess.
//   kind   REQUIRED. listen | read | watch | signal | note
//   title  REQUIRED.
//   link   optional. the thing itself.
//   note   optional. your own words. leave it out rather than pad it —
//          an empty note is the page's default, not a gap.
//
// (This file can also be edited by editor.html — the > in the footer.)
// ─────────────────────────────────────────────────────────────────────────`;

        // Working copy of the data (a deep copy so we don't mutate the original).
        let items = JSON.parse(JSON.stringify(SCRAPS));
        let editingIndex = null; // null means "adding new"; a number means "editing that one"

        // Grab the form fields once.
        const el = (id) => document.getElementById(id);
        const fTitle = el("f-title"), fKind = el("f-kind"), fDate = el("f-date"),
              fLink = el("f-link"), fNote = el("f-note");

        // Build the kind dropdown from KINDS in scraps.js, so the vocabulary
        // here can never drift from the one the site actually renders.
        KINDS.forEach(function (k) {
            const option = document.createElement("option");
            option.value = k.key;
            option.textContent = k.key;
            fKind.appendChild(option);
        });

        // Build today's date from local parts. toISOString() would be UTC, which
        // writes yesterday's date for anyone in IST before 05:30.
        el("today-btn").addEventListener("click", function () {
            const now = new Date();
            const pad = (n) => String(n).padStart(2, "0");
            fDate.value = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
        });

        // Read the form into a scrap object.
        function readForm() {
            const scrap = {
                kind: fKind.value,
                title: fTitle.value.trim(),
            };
            // An unknown date is written by leaving the key out entirely —
            // never as "" or null. Absence is the encoding.
            const date = fDate.value.trim();
            if (date) scrap.date = date;
            if (fLink.value.trim()) scrap.link = fLink.value.trim();
            if (fNote.value.trim()) scrap.note = fNote.value.trim();
            return scrap;
        }

        // Put a scrap into the form (for editing), or clear it (pass nothing).
        function writeForm(scrap) {
            scrap = scrap || {};
            fTitle.value = scrap.title || "";
            fKind.value = scrap.kind || KINDS[0].key;
            fDate.value = scrap.date || "";
            fLink.value = scrap.link || "";
            fNote.value = scrap.note || "";
        }

        function resetForm() {
            editingIndex = null;
            writeForm(null);
            el("submit-btn").textContent = "+ Add scrap";
            el("cancel-btn").style.display = "none";
        }

        // Add (or, when editing, update) a scrap.
        el("submit-btn").addEventListener("click", function () {
            const scrap = readForm();
            if (!scrap.title) { setStatus("A title is required."); return; }
            if (!DATE_RE.test(fDate.value.trim())) {
                setStatus("Date must be 2026-07-30, or 2026-07, or blank.");
                return;
            }
            if (editingIndex === null) items.push(scrap);
            else items[editingIndex] = scrap;
            resetForm();
            renderAll();
            setStatus("Saved to the list. Don't forget to press “Save to scraps-data.js”.");
        });

        el("cancel-btn").addEventListener("click", resetForm);

        // Load a scrap back into the form to edit it.
        function editItem(i) {
            editingIndex = i;
            writeForm(items[i]);
            el("submit-btn").textContent = "Save changes";
            el("cancel-btn").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function deleteItem(i) {
            if (!confirm("Delete “" + items[i].title + "”?")) return;
            items.splice(i, 1);
            if (editingIndex === i) resetForm();
            renderAll();
        }

        function moveItem(i, dir) {
            const j = i + dir;
            if (j < 0 || j >= items.length) return;
            const tmp = items[i]; items[i] = items[j]; items[j] = tmp;
            renderAll();
        }

        // Draw the editable list of rows.
        function renderList() {
            const list = el("list");
            list.innerHTML = "";
            el("count").textContent = "(" + items.length + ")";
            items.forEach(function (scrap, i) {
                const row = document.createElement("div");
                row.className = "list-row";
                row.innerHTML =
                    '<span class="grab">' + (i + 1) + '.</span>' +
                    '<span class="name"></span>' +
                    '<span class="mini-tag"></span>' +
                    '<span class="mini-tag mini-date"></span>';
                row.querySelector(".name").textContent = scrap.title;
                row.querySelector(".mini-tag").textContent = scrap.kind || "";
                row.querySelector(".mini-date").textContent = scrap.date || "undated";

                [["↑", function () { moveItem(i, -1); }],
                 ["↓", function () { moveItem(i, 1); }],
                 ["edit", function () { editItem(i); }],
                 ["✕", function () { deleteItem(i); }]].forEach(function (pair) {
                    const b = document.createElement("button");
                    b.className = "icon-btn";
                    b.textContent = pair[0];
                    b.addEventListener("click", pair[1]);
                    row.appendChild(b);
                });
                list.appendChild(row);
            });
        }

        // Preview with the SITE'S OWN renderer, so what you see here is the real
        // page: sorted newest-first, grouped by month, repeated days suppressed.
        // (Which is why the ↑/↓ buttons only break ties between equal dates.)
        function renderPreview() {
            renderLogInto(el("editor-preview"), items, null);
        }

        function renderAll() { renderList(); renderPreview(); }

        function setStatus(msg) { el("status").textContent = msg; }

        // Turn the working list back into the text of scraps-data.js.
        function serialize() {
            const blocks = items.map(function (s) {
                const lines = ["    {"];
                // No date key at all when it's unknown — see the file header.
                if (s.date) lines.push("        date: " + JSON.stringify(s.date) + ",");
                lines.push("        kind: " + JSON.stringify(s.kind) + ",");
                lines.push("        title: " + JSON.stringify(s.title) + ",");
                if (s.link) lines.push("        link: " + JSON.stringify(s.link) + ",");
                if (s.note) lines.push("        note: " + JSON.stringify(s.note) + ",");
                lines.push("    },");
                return lines.join("\n");
            });
            return FILE_HEADER + "\n\nconst SCRAPS = [\n" + blocks.join("\n") + "\n];\n";
        }

        // Save: write straight to the file (Chrome/Edge) or download it.
        el("save-btn").addEventListener("click", async function () {
            const text = serialize();
            try {
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        // `id` makes the browser remember the folder you chose
                        // last time, so after you save into assets/ once, it
                        // defaults there from then on.
                        id: "scrapsDataFile",
                        suggestedName: "scraps-data.js",
                        types: [{ description: "JavaScript", accept: { "text/javascript": [".js"] } }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(text);
                    await writable.close();
                    setStatus("Saved! Reload scraps.html to see it. Then publish to go live.");
                } else {
                    const blob = new Blob([text], { type: "text/javascript" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url; a.download = "scraps-data.js"; a.click();
                    URL.revokeObjectURL(url);
                    setStatus("Downloaded. Move it into your assets/ folder, replacing the old file.");
                }
            } catch (err) {
                if (err && err.name === "AbortError") return; // user closed the picker
                setStatus("Couldn't save: " + err);
            }
        });

        // First paint.
        renderAll();
    </script>
</body>

</html>
